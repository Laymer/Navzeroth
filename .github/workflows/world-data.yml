name: World data
# Task V2.8b (ADR 0007 §1). Once a week, regenerate the world data from the sources
# that answer scripts (CMaNGOS classic-db, wago.tools), then register, build content
# and evaluate the gate. The pipeline reuses the committed
# release/v1/world-data-target.json (detect is skipped: no client here) and, only
# when the generated output changed, pushes branch data/world-weekly and opens or
# updates a draft pull request. It never pushes to main or force-pushes; the owner
# merges. Requires the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings > Actions > General > Workflow permissions).
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: world-data
  cancel-in-progress: false
jobs:
  pipeline:
    name: Weekly world-data pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 0
      - name: Enable Git LFS filters for staging pointers
        run: git lfs install --local
      - run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run the pipeline without Wowhead sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 data-generators/pipeline.py --no-network-sources --skip detect --branch data/world-weekly
      - name: Keep the stage logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: world-data-logs-${{ github.run_id }}
          path: data-generators/.cache/logs/
          if-no-files-found: ignore
          retention-days: 30
