name: Build watch
# Task V4.1. Once a day, read Blizzard's public, unauthenticated version list
# for the WoW Forever products and open one issue per new build or new `wow*`
# product code. Information only: it never admits a build, commits or pushes.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: build-watch
  cancel-in-progress: false
jobs:
  watch:
    name: WoW Forever build watch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Parser tests
        run: node --test scripts/build-watch/lib.test.mjs
      - name: Read recorded titles once (a failed lookup stops the job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create build-watch --color 5319e7 --description "WoW Forever build watch" --force >/dev/null
          gh issue list --state all --label build-watch --limit 1000 --json title --jq '[.[].title]' > "$RUNNER_TEMP/existing.json"
      - name: Read the public version list
        run: node scripts/build-watch/watch.mjs "$RUNNER_TEMP/existing.json" > "$RUNNER_TEMP/build-watch.json"
      - name: Summarize
        run: |
          node -e '
            const r = require(process.argv[1]);
            const lines = ["| Product | Version | Build | Regions |", "| --- | --- | ---: | --- |"];
            for (const p of r.products) for (const b of p.builds) lines.push(`| ${p.product} | ${b.version} | ${b.build} | ${b.regions.join(", ")} |`);
            lines.push("", `New wow* product codes: ${r.new_product_codes.length ? r.new_product_codes.join(", ") : "none"}`);
            console.log(lines.join("\n"));
          ' "$RUNNER_TEMP/build-watch.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Open issues for builds and product codes not seen before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # watch.mjs already dropped recorded titles and capped the run (MAX_ISSUES_PER_RUN).
          count=$(jq '.issues | length' "$RUNNER_TEMP/build-watch.json")
          for i in $(seq 0 $((count - 1))); do
            title=$(jq -r ".issues[$i].title" "$RUNNER_TEMP/build-watch.json")
            jq -r ".issues[$i].body" "$RUNNER_TEMP/build-watch.json" > "$RUNNER_TEMP/body.md"
            gh issue create --title "$title" --label build-watch --body-file "$RUNNER_TEMP/body.md"
          done
          echo "opened $count issue(s)"
