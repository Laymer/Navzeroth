name: Hosted Windows offline firewall engineering probe
# Opt-in diagnostic only. No protected gate, product build or acceptance result.
on:
  push:
    branches: ['verify/offline-firewall-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-firewall-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-firewall-engineering-probe:
    name: Offline firewall engineering probe (not acceptance)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Preserve exact source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          persist-credentials: false
      - name: Hold firewall isolation longer than the offline workload and restore exactly
        shell: pwsh
        run: ./scripts/windows/Probe-HostedOfflineFirewall.ps1 -OutputDirectory "$env:RUNNER_TEMP/offline-firewall-probe" -HoldSeconds 600
      - name: Retain bounded engineering diagnostics after restoration
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-firewall-engineering-probe-${{ github.sha }}
          path: ${{ runner.temp }}/offline-firewall-probe/
          if-no-files-found: warn
          retention-days: 7
