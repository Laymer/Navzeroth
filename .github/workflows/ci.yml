name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: every job above runs, plus the stability job below.
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request pushes are cancelled; main and scheduled runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - run: cargo fmt --all --check
  rust:
    name: Rust ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    # Recent Windows runs took 15.7 to 18.9 minutes and run 38803371336 hit the old 20.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false # only two exact role-audit inputs are selectively hydrated below
      - name: Hydrate exact role-audit test inputs only
        timeout-minutes: 5
        run: python scripts/hydrate-role-audit-inputs.py --root .
      - run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets --exclude azeroth-desktop -- -D warnings
      - run: cargo test --locked --workspace --exclude azeroth-desktop
      - name: Golden drift (every Rust-written golden regenerates byte for byte)
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-golden-drift.sh
      - name: Contract and transport fixture validation
        run: cargo run --locked -p azeroth-cli -- validate-fixtures
      - name: Reference content validation and explicit coverage gaps
        run: cargo run --locked -p azeroth-cli -- validate-content --input content/forever --json
      - name: Lua predicate and gear parity
        run: cargo test --locked -p azeroth-lua-harness --test predicate_parity --test gear_parity
      - name: Atlas content pointer checks (declared imagery, no LFS download)
        run: cargo run --locked -p azeroth-cli -- prepare-atlas --manifest content/forever/atlas/eastern-kingdoms/atlas.manifest.json --content-root content/forever --check-pointer
      - name: Every LFS-attributed tracked file is a pointer blob
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' path; do
            if [ "$(git cat-file blob "HEAD:$path" | head -c 42)" != "version https://git-lfs.github.com/spec/v1" ]; then
              echo "::error::$path is tracked with filter=lfs but is not an LFS pointer"
              status=1
            fi
          done < <(git ls-files -z | git check-attr --stdin -z filter | awk 'BEGIN{RS="\0"; ORS="\0"} NR%3==1{p=$0} NR%3==0 && $0=="lfs"{print p}')
          exit $status
      - run: git diff --exit-code
  python:
    name: Python data generators
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Offline unit tests only: generators never use the network in CI.
      - run: NAVZEROTH_DATAGEN_OFFLINE=1 python3 -m unittest discover -s data-generators/tests -v
      - name: Exact role-audit hydration tests (local LFS objects only)
        run: python3 -m unittest discover -s scripts/tests -p test_role_audit_inputs.py -v
  lua:
    name: Lua static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      # Runs the pinned luacheck 0.26.1 image against the committed .luacheckrc. The
      # Lua functional tests run in the Rust jobs (crates/lua-harness).
      - uses: lunarmodules/luacheck@2445a9dd3859655646bd6eb848459f2b46b4a3e3 # v0.26.1
        with:
          args: --no-color addons/AzerothNavigator
      - run: git diff --exit-code
  pnpm:
    name: pnpm ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm --version
      - id: store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code
      - name: Regenerate TypeScript contracts
        run: pnpm contracts:types
      - name: Check generated contracts are committed
        run: git diff --exit-code
      - name: Contract fixtures, JSON Schema and TypeScript checks
        run: pnpm contracts:check
      - name: Coverage inventory and raw-evidence adversaries
        run: node --test scripts/coverage/inventory.test.mjs scripts/coverage/gate.test.mjs scripts/coverage/configuration.test.mjs scripts/coverage/rust-environment.test.mjs scripts/coverage/process-output.test.mjs
      - name: Strict reference-content v2 schema checks
        run: node scripts/validate-content-v2-schema.mjs
      - name: Dependency notice and performance guard tests (offline)
        run: node --test scripts/dependency-notices.test.mjs scripts/measure-continuation.test.mjs
      - name: Build watch parser tests (offline, synthetic tables)
        run: node --test scripts/build-watch/lib.test.mjs
  desktop:
    name: Desktop shell Windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop lint
      - run: pnpm --dir apps/desktop test:unit
      - run: pnpm --dir apps/desktop build
      - name: Compile and test the native shell (build evidence only; no UI interaction)
        run: |
          cargo clippy --locked -p azeroth-desktop --all-targets -- -D warnings
          cargo test --locked -p azeroth-desktop
      - run: git diff --exit-code

  browser:
    name: Mocked desktop Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop lint
      - run: pnpm --dir apps/desktop test:unit
      - run: pnpm --dir apps/desktop build
      - name: Production bundle has no data URIs or remote assets
        run: node scripts/check-dist.mjs
      - name: Install browser and system libraries
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      # Both Playwright projects: "dev" (every spec, vite dev server) and "prod-csp"
      # (the built bundle served with the native CSP). Retries are 0 in the config.
      - run: pnpm --dir apps/desktop test:e2e
      - name: Upload screen captures for human review (not pixel assertions)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-screens
          path: apps/desktop/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - run: git diff --exit-code

  stability:
    name: Stability (repeat runs)
    # Nightly and on demand only. A flake shows up here as a failure, never as a rerun.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - name: Hydrate exact role-audit test inputs only
        timeout-minutes: 5
        run: python scripts/hydrate-role-audit-inputs.py --root .
      - run: rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Install browser and system libraries
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - name: Playwright, both projects, three times each
        run: pnpm --dir apps/desktop exec playwright test --repeat-each=3
      - name: Full Rust test suite, twice
        run: |
          cargo test --locked --workspace --exclude azeroth-desktop
          cargo test --locked --workspace --exclude azeroth-desktop
      - name: Lua harness, three times
        run: |
          for run in 1 2 3; do
            cargo test --locked -p azeroth-lua-harness
          done
      - run: git diff --exit-code
