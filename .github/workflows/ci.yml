name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - run: cargo fmt --all --check
  rust:
    name: Rust ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false # imagery stays a pointer; CI never downloads LFS objects
      - run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Atlas content pointer checks (declared imagery, no LFS download)
        run: cargo run --locked -p azeroth-cli -- prepare-atlas --manifest content/forever/atlas/eastern-kingdoms/atlas.manifest.json --content-root content/forever --check-pointer
      - name: Every LFS-attributed tracked file is a pointer blob
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' path; do
            if [ "$(git cat-file blob "HEAD:$path" | head -c 42)" != "version https://git-lfs.github.com/spec/v1" ]; then
              echo "::error::$path is tracked with filter=lfs but is not an LFS pointer"
              status=1
            fi
          done < <(git ls-files -z | git check-attr --stdin -z filter | awk 'BEGIN{RS="\0"; ORS="\0"} NR%3==1{p=$0} NR%3==0 && $0=="lfs"{print p}')
          exit $status
      - run: git diff --exit-code
  pnpm:
    name: pnpm ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm --version
      - id: store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code
      - name: Regenerate TypeScript contracts
        run: pnpm contracts:types
      - name: Check generated contracts are committed
        run: git diff --exit-code
      - name: Contract fixtures, JSON Schema and TypeScript checks
        run: pnpm contracts:check
