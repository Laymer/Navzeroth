name: Windows package
# Task M9.4. Builds the NSIS installer and addon package on Windows, exercises
# the addon helper and a silent install/uninstall, and uploads the files.
# A version tag (v0.1.0) additionally creates a DRAFT GitHub release; publishing
# it stays a manual owner decision (AGENTS.md, plan section 20.2).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      acceptance_candidate:
        description: 'Build non-publishable acceptance artifacts (complete licensed content required)'
        type: boolean
        default: false
      test_signing:
        description: 'Sign the installer with the SignPath test-signing policy (untrusted test certificate; not for release)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    name: Windows installer and addon package
    runs-on: windows-2025
    # A release-signing request waits for a manual SignPath approval.
    timeout-minutes: ${{ github.ref_type == 'tag' && 170 || 110 }}
    permissions:
      contents: read
      actions: read # the SignPath connector reads this job and downloads the unsigned artifact
    steps:
      - name: Preserve committed source bytes in packages
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true # hydrate exact bytes; only verified material selections may be packaged
          fetch-depth: 0 # release gate must prove the tested commit's ancestry
      - name: Release notes exist for a tag (plan M9.5)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG#v}.md"
          test -f "$notes" || { echo "::error::$notes is missing; write the release notes before tagging."; exit 1; }
      - name: Addon helper tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-AddonInstaller.ps1 -Shell powershell.exe
      - name: Addon helper tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-AddonInstaller.ps1 -Shell pwsh
      - name: Stable packaging gate tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-ReleaseGate.ps1 -Shell powershell.exe
      - name: Stable packaging gate tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-ReleaseGate.ps1 -Shell pwsh
      - name: Release material transport tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-ReleaseMaterials.ps1
      - name: Release material transport tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-ReleaseMaterials.ps1
      - name: Acceptance candidate transport tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-AcceptanceCandidate.ps1
      - name: Acceptance candidate transport tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-AcceptanceCandidate.ps1
      - name: Stable preparation and hosted evidence tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-StablePreparation.ps1
      - name: Hosted producer helper tests (Windows PowerShell 5.1 mocks)
        shell: powershell
        run: ./scripts/windows/Test-StableAcceptanceHelpers.ps1
      - name: Hosted producer helper tests (PowerShell 7 mocks)
        shell: pwsh
        run: ./scripts/windows/Test-StableAcceptanceHelpers.ps1
      - name: Stable preparation and hosted evidence tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-StablePreparation.ps1
      - name: Guided acceptance kit tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-AcceptanceKit.ps1
      - name: Guided acceptance kit tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-AcceptanceKit.ps1
      - name: Native smoke helper tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-NativeSmokeHelpers.ps1
      - name: Native smoke helper tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-NativeSmokeHelpers.ps1
      - name: Unsigned release policy tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-ReleasePolicy.ps1
      - name: Unsigned release policy tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-ReleasePolicy.ps1
      - name: Signing verifier tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/windows/Test-Signing.ps1
      - name: Signing verifier tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/windows/Test-Signing.ps1
      - run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-
      - name: Real CLI and LFS material artifact integration (synthetic sources)
        shell: powershell
        env:
          NAVZEROTH_TEST_PWSH: powershell.exe
        run: cargo test --locked -p azeroth-cli --test release_materials -- --ignored
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Native smoke pure-helper tests (synthetic, not native acceptance)
        shell: bash
        run: node --test scripts/windows/stable-workload-lib.test.mjs scripts/windows/native-smoke-lib.test.mjs scripts/windows/native-command-boundaries.test.mjs scripts/windows/verify-installed-tree.test.mjs
      - name: Install isolated Corepack
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/corepack" --no-package-lock --no-audit --no-fund corepack@0.36.0
          echo "$RUNNER_TEMP/corepack/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build installer and addon package (Windows PowerShell 5.1)
        id: build_windows
        shell: powershell
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ACCEPTANCE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_candidate && github.ref_type != 'tag' }}
          # Optional signing command; the separate word %1 is the file to sign
          # Unset means an unsigned installer (SmartScreen warns).
          NAVZEROTH_SIGN_COMMAND: ${{ secrets.NAVZEROTH_SIGN_COMMAND }}
        run: |
          $expected = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'v' + (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version }
          . ./scripts/windows/Release-Policy.ps1
          $unsigned = Get-UnsignedReleasePolicy $PWD $expected.TrimStart('v')
          if ($null -ne $unsigned -and $env:NAVZEROTH_SIGN_COMMAND) { throw 'Declared unsigned releases forbid NAVZEROTH_SIGN_COMMAND' }
          $candidate = $env:ACCEPTANCE_CANDIDATE -eq 'true'
          $phaseOptions = @{}
          $stable = -not $candidate -and $expected -ceq 'v1.0.0'
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('stable=' + $stable.ToString().ToLowerInvariant() + "`n"), (New-Object Text.UTF8Encoding($false)))
          if ($stable) {
            New-Item -ItemType Directory -Path dist -Force | Out-Null
            cargo run --locked -p azeroth-cli -- assemble-bundled-content --root . --output dist/bundled-content --identity release/v1/bundled-content-build-identity.json
            if ($LASTEXITCODE -ne 0) { throw 'Source-bound signed bundle assembly failed' }
            $phaseOptions['ReadinessPhase'] = 'prebuild'
            $phaseOptions['BundledContentDirectory'] = 'dist/bundled-content'
            $phaseOptions['BundleBuildIdentityPath'] = 'release/v1/bundled-content-build-identity.json'
          }
          ./scripts/windows/Build-Windows.ps1 -SkipTests -ExpectedVersion $expected -OutputDirectory dist/windows -AcceptanceCandidate:$candidate @phaseOptions
      # ADR 0008: only source-declared versions may publish unsigned stable assets.
      - name: Signing mode
        id: signing
        shell: pwsh
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TEST_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.test_signing && !inputs.acceptance_candidate }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          . ./scripts/windows/Release-Policy.ps1
          $mode = 'none'
          $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $unsigned = Get-UnsignedReleasePolicy $PWD $version
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -cne ('v' + $version)) { throw 'Tag and source version differ' }
            if ($null -ne $unsigned) { Write-Warning "Release $version is explicitly unsigned" }
            elseif ($env:ORGANIZATION) { $mode = 'release-signing' }
            elseif (Test-StableReleaseVersion $version) { throw 'Stable release requires signing or an explicit unsigned policy' }
            else { Write-Warning "Preview $version is unsigned" }
          } elseif ($env:TEST_SIGNING -eq 'true') {
            if ($null -ne $unsigned) { throw 'Test signing conflicts with the declared unsigned policy' }
            if (-not $env:ORGANIZATION) { throw 'test_signing requires SIGNPATH_ORGANIZATION_ID' }
            $mode = 'test-signing'
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "signing mode: $mode"
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: steps.signing.outputs.mode != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer-${{ github.sha }}
          path: dist/windows/*-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: steps.signing.outputs.mode != 'none'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Navzeroth' }}
          signing-policy-slug: ${{ steps.signing.outputs.mode }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ steps.signing.outputs.mode == 'release-signing' && 7200 || 900 }}
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: Verify the signed installer and refresh checksums
        if: steps.signing.outputs.mode != 'none'
        shell: powershell
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
        run: |
          $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $release = $env:MODE -eq 'release-signing'
          ./scripts/windows/Complete-SignedInstaller.ps1 -Version $version -Directory dist/windows -SignedDirectory (Join-Path $env:RUNNER_TEMP 'signed') -RequireTrusted:$release -ExpectedSubject $env:EXPECTED_SUBJECT
      - name: Test first-start observation harness
        shell: pwsh
        run: ./scripts/windows/Test-FirstStartSmoke.ps1
      - name: Rehearse declared unsigned release artifact verification
        if: steps.signing.outputs.mode == 'none'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          . ./scripts/windows/Release-Policy.ps1
          if ($null -ne (Get-UnsignedReleasePolicy $PWD $version)) {
            $setup = @(Get-ChildItem dist/windows -Filter '*-x64-setup.exe' -File)
            if ($setup.Count -ne 1) { throw 'Expected one unsigned installer' }
            $hash = (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence = Join-Path $env:RUNNER_TEMP 'native-smoke'
            New-Item -ItemType Directory -Path $evidence -Force | Out-Null
            ./scripts/windows/Verify-DownloadedRelease.ps1 -Directory dist/windows -Version $version -InstallerSha256 $hash -Receipt (Join-Path $evidence 'prepared-release-verification.json') -Phase prepared
            if ($LASTEXITCODE -ne 0) { throw 'Prepared release verification rehearsal failed' }
          }
      - name: Silent install, first start and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/windows -Filter '*-x64-setup.exe' | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA 'Azeroth Navigator'
          $exe = Join-Path $installDir 'azeroth-desktop.exe'
          $data = Join-Path $env:APPDATA 'io.github.laymer.azeroth-navigator'
          $programs = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcuts = @((Join-Path $programs 'Azeroth Navigator.lnk'), (Join-Path $programs 'Azeroth Navigator - WoW addon.lnk'))

          # A previously installed addon must survive both silent operations unchanged.
          $gameAddOns = Join-Path $env:RUNNER_TEMP 'Synthetic Game\Interface\AddOns'
          New-Item -ItemType Directory -Path $gameAddOns -Force | Out-Null
          ./scripts/windows/Install-AzerothNavigatorAddon.ps1 -Action Install -AddOnsPath $gameAddOns -Quiet
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed synthetic addon' }
          $sentinel = Join-Path $gameAddOns 'AzerothNavigator\SilentInstallSentinel.txt'
          Set-Content -LiteralPath $sentinel -Value 'Keep this existing addon unchanged'

          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $sentinel)) { throw 'Silent install replaced the game addon' }
          foreach ($file in @($exe, (Join-Path $installDir 'uninstall.exe'),
                  (Join-Path $installDir 'addon\Install-AzerothNavigatorAddon.ps1'),
                  (Join-Path $installDir 'addon\AzerothNavigator\AzerothNavigator.toc'),
                  (Join-Path $installDir 'addon\AzerothNavigator\LICENSE'),
                  (Join-Path $installDir 'font-notices\OFL-Inter.txt'),
                  (Join-Path $installDir 'font-notices\OFL-Cinzel.txt'),
                  (Join-Path $installDir 'font-notices\THIRD_PARTY.md')) + $shortcuts) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing after install: $file" }
            "installed: $file"
          }
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Azeroth Navigator' }
          if (-not $key) { throw 'No Apps & features entry' }
          $displayVersion = (Get-ItemProperty $key.PSPath).DisplayVersion
          $sourceVersion = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($displayVersion -ne $sourceVersion) { throw "Installed version $displayVersion does not match source $sourceVersion" }
          "Apps & features: $displayVersion"
          $bundledLicense = Get-Content -Raw -LiteralPath (Join-Path $installDir 'addon\AzerothNavigator\LICENSE')
          if ($bundledLicense -ne (Get-Content -Raw addons/AzerothNavigator/LICENSE)) { throw 'Bundled addon license differs from source' }
          # The OFL notices for the bundled fonts must ship byte for byte.
          foreach ($pair in @(
              @('apps/desktop/src/theme/fonts/OFL-Inter.txt', 'font-notices\OFL-Inter.txt'),
              @('apps/desktop/src/theme/fonts/OFL-Cinzel.txt', 'font-notices\OFL-Cinzel.txt'),
              @('apps/desktop/THIRD_PARTY.md', 'font-notices\THIRD_PARTY.md'))) {
            $installed = Join-Path $installDir $pair[1]
            if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash) { throw "Bundled font notice differs from source: $($pair[1])" }
          }

          # Exact resources and generated binaries only; reject private or unexpected files.
          & node scripts/windows/verify-installed-tree.mjs . $installDir
          if ($LASTEXITCODE -ne 0) { throw 'Installed resource inventory differs from source' }

          # Verify every dependency notice/source after installing, including no extra files.
          & node scripts/dependency-notices.mjs --installed (Join-Path $installDir 'local-data-notices')
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependency notices/source closure failed' }

          # Bound initialization separately from the minimum liveness observation.
          . ./scripts/windows/First-StartSmoke.ps1
          Invoke-FirstStartSmoke -Executable $exe -DataDirectory $data

          # Silent uninstall. The NSIS uninstaller re-launches itself from TEMP, so wait for its effect.
          Start-Process -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path -LiteralPath $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath $exe) { throw 'The application is still installed after uninstall' }
          if (Test-Path -LiteralPath $installDir) { Get-ChildItem -LiteralPath $installDir -Recurse -Force | ForEach-Object FullName; throw "Leftovers in $installDir" }
          foreach ($shortcut in $shortcuts) { if (Test-Path -LiteralPath $shortcut) { throw "Shortcut left after uninstall: $shortcut" } }
          "uninstalled: $installDir and both shortcuts removed"
          # A silent uninstall keeps user data (the "delete app data" box is unticked by default).
          if (-not (Test-Path -LiteralPath (Join-Path $data 'snapshots.sqlite3'))) { throw 'Silent uninstall removed user data' }
          if (-not (Test-Path -LiteralPath $sentinel)) { throw 'Silent uninstall removed the game addon' }
          "user data and existing addon kept: $data"
      - run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance_candidate && github.ref_type != 'tag' && 'azeroth-navigator-acceptance-candidate' || 'azeroth-navigator-windows' }}-${{ github.sha }}
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Native WebView2 smoke over CDP (blocking regression check, not WIN-* acceptance)
        id: native_smoke
        continue-on-error: true
        shell: pwsh
        env:
          NAVZEROTH_NATIVE_STARTUP_MS: ${{ steps.build_windows.outputs.stable == 'true' && '1200000' || '30000' }}
        run: |
          . ./scripts/windows/Native-Smoke-Helpers.ps1
          $evidence = Join-Path $env:RUNNER_TEMP 'native-smoke'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $setup = Get-NativeSmokeSetup -Directory dist/windows
          $installDir = Join-Path $env:LOCALAPPDATA 'Azeroth Navigator'
          $exe = Join-Path $installDir 'azeroth-desktop.exe'
          $data = Join-Path $env:APPDATA 'io.github.laymer.azeroth-navigator'
          Stop-NativeSmokeProcesses
          # The first-start step left its own store; this smoke needs an empty database.
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          Install-NativeSmokeSetup -SetupPath $setup.FullName
          try {
            Invoke-NativeSmokeNode @('scripts/windows/Native-Smoke.mjs', '--mode', 'smoke', '--label', 'candidate-smoke',
              '--exe', $exe, '--port', '9222', '--db', (Join-Path $data 'snapshots.sqlite3'),
              '--out', (Join-Path $evidence 'smoke\report.json'))
          } finally {
            Stop-NativeSmokeProcesses
            Uninstall-NativeSmokeApp -InstallDirectory $installDir
          }
      - name: Native upgrade smoke from the published baseline (blocking regression check, not WIN-* acceptance)
        id: native_upgrade
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAVZEROTH_NATIVE_STARTUP_MS: ${{ steps.build_windows.outputs.stable == 'true' && '1200000' || '30000' }}
          BASELINE_TAG: ${{ github.ref_name == 'v1.0.0' && 'v1.0.0-rc.1' || 'v0.9.2' }}
        run: |
          . ./scripts/windows/Native-Smoke-Helpers.ps1
          $evidence = Join-Path $env:RUNNER_TEMP 'native-smoke'
          $baselineDir = Join-Path $env:RUNNER_TEMP 'native-baseline'
          New-Item -ItemType Directory -Path $evidence, $baselineDir -Force | Out-Null
          $installDir = Join-Path $env:LOCALAPPDATA 'Azeroth Navigator'
          $exe = Join-Path $installDir 'azeroth-desktop.exe'
          $data = Join-Path $env:APPDATA 'io.github.laymer.azeroth-navigator'
          $db = Join-Path $data 'snapshots.sqlite3'
          $candidateSetup = Get-NativeSmokeSetup -Directory dist/windows
          $candidate = (Get-Content -Raw apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $baseline = $env:BASELINE_TAG.TrimStart('v')

          # 1. Download the published baseline and verify it against its own checksum file.
          gh release download $env:BASELINE_TAG --repo $env:GITHUB_REPOSITORY --dir $baselineDir --pattern '*-x64-setup.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "Could not download $($env:BASELINE_TAG) assets" }
          $baselineSetup = Get-NativeSmokeSetup -Directory $baselineDir
          Invoke-NativeSmokeNode @('scripts/windows/Native-Smoke.mjs', '--mode', 'check-download', '--label', 'baseline-download',
            '--file', $baselineSetup.FullName, '--sums', (Join-Path $baselineDir 'SHA256SUMS.txt'),
            '--name', $baselineSetup.Name, '--out', (Join-Path $evidence 'upgrade\baseline-download.json'))

          $classificationJson = & node scripts/windows/classify-upgrade.mjs $baseline $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Invalid upgrade version metadata' }
          $classification = $classificationJson | ConvertFrom-Json
          $kind = $classification.kind
          "upgrade kind: $kind (baseline $baseline, candidate $candidate)"
          if ($kind -eq 'baseline_newer_than_candidate') { throw "Baseline $baseline is newer than candidate $candidate" }

          Stop-NativeSmokeProcesses
          if (Test-Path -LiteralPath $data) { Remove-Item -LiteralPath $data -Recurse -Force }
          try {
            # 2. Install the baseline and populate it through CDP.
            Install-NativeSmokeSetup -SetupPath $baselineSetup.FullName
            if ((Get-InstalledDisplayVersion) -ne $baseline) { throw "Installed version is $(Get-InstalledDisplayVersion), expected baseline $baseline" }
            Invoke-NativeSmokeNode @('scripts/windows/Native-Smoke.mjs', '--mode', 'populate', '--label', 'baseline-populate',
              '--exe', $exe, '--port', '9223', '--out', (Join-Path $evidence 'upgrade\populate.json'))
            Stop-NativeSmokeProcesses
            Invoke-NativeSmokeNode @('scripts/windows/Native-Smoke.mjs', '--mode', 'db-summary', '--label', 'db-before',
              '--db', $db, '--out', (Join-Path $evidence 'upgrade\db-before.json'))

            # 3. Install the candidate over it.
            Install-NativeSmokeSetup -SetupPath $candidateSetup.FullName
            if ((Get-InstalledDisplayVersion) -ne $candidate) { throw "Installed version is $(Get-InstalledDisplayVersion), expected candidate $candidate" }

            # 4. Launch the candidate: data kept, migrations only moved forward.
            Invoke-NativeSmokeNode @('scripts/windows/Native-Smoke.mjs', '--mode', 'verify', '--label', 'candidate-verify',
              '--exe', $exe, '--port', '9224', '--db', $db, '--out', (Join-Path $evidence 'upgrade\verify.json'))
            Stop-NativeSmokeProcesses
            $before = Get-Content -Raw (Join-Path $evidence 'upgrade\db-before.json') | ConvertFrom-Json
            $after = Get-Content -Raw (Join-Path $evidence 'upgrade\verify.json') | ConvertFrom-Json
            $beforeDb = $before.db; $afterDb = $after.db
            if ($afterDb.max_migration_version -lt $beforeDb.max_migration_version) { throw 'Schema version went backwards after the candidate started' }
            $lost = @($beforeDb.tables | Where-Object { $afterDb.tables -notcontains $_ })
            if ($lost.Count -gt 0) { throw "Tables lost across the install: $($lost -join ', ')" }
            "schema_migrations: baseline max $($beforeDb.max_migration_version) ($($beforeDb.migrations) rows) -> candidate max $($afterDb.max_migration_version) ($($afterDb.migrations) rows)"

            # 5. Downgrade attempt (allowDowngrades is false): record the outcome; the installed version must not move.
            $downgrade = [ordered]@{ kind = $kind; baseline = $baseline; candidate = $candidate; attempted = $false }
            if ($kind -eq 'upgrade') {
              $result = Invoke-BoundedProcess -FilePath $baselineSetup.FullName -ArgumentList @('/S') -TimeoutSeconds 120
              Stop-NativeSmokeProcesses
              $downgrade.attempted = $true
              $downgrade.exit_code = $result.ExitCode
              $downgrade.timed_out = $result.TimedOut
              $downgrade.installed_version_after = Get-InstalledDisplayVersion
              $downgrade | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'upgrade\downgrade.json')
              "downgrade attempt: exit code $($result.ExitCode), timed out $($result.TimedOut), installed $(Get-InstalledDisplayVersion)"
              if ((Get-InstalledDisplayVersion) -ne $candidate) { throw "Downgrade was not refused: installed version is $(Get-InstalledDisplayVersion)" }
            } else {
              $downgrade.reason = 'Candidate and baseline versions are equal, so a downgrade cannot be attempted; this run exercised a reinstall over existing data, not an upgrade.'
              $downgrade | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'upgrade\downgrade.json')
              $downgrade.reason
            }
          } finally {
            Stop-NativeSmokeProcesses
            Uninstall-NativeSmokeApp -InstallDirectory $installDir
          }
      - name: Upload native smoke evidence (regression evidence, not a release asset)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/native-smoke/
          if-no-files-found: warn
          retention-days: 14
      # The installer artifact above is already uploaded, so a smoke failure cannot lose the release
      # inputs; this gate still fails the job (and so skips draft-release) when either smoke failed.
      - name: Native smoke gate
        if: always()
        shell: bash
        run: |
          echo "smoke=${{ steps.native_smoke.outcome }} upgrade=${{ steps.native_upgrade.outcome }}"
          [ "${{ steps.native_smoke.outcome }}" != failure ] && [ "${{ steps.native_upgrade.outcome }}" != failure ]

      - name: Actual schema4 hosted Windows acceptance over the signed full bundle
        id: stable_acceptance
        if: steps.build_windows.outputs.stable == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/windows/Native-Smoke-Helpers.ps1
          . ./scripts/windows/Release-Materials.ps1
          $baseline = Join-Path $env:RUNNER_TEMP 'stable-rc1'
          New-Item -ItemType Directory -Path $baseline | Out-Null
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = (Get-Command gh).Source
          $start.UseShellExecute = $false
          foreach ($arg in @('release','download','v1.0.0-rc.1','--repo',$env:GITHUB_REPOSITORY,'--dir',$baseline,'--pattern','*-x64-setup.exe')) { $start.ArgumentList.Add($arg) }
          $download = [Diagnostics.Process]::new(); $download.StartInfo = $start
          try {
            if (-not $download.Start()) { throw 'Cannot start baseline download' }
            if (-not $download.WaitForExit(300000)) { $download.Kill($true); throw 'RC1 baseline download exceeded five minutes' }
            if ($download.ExitCode -ne 0) { throw 'RC1 baseline download failed' }
          } finally { $download.Dispose() }
          $published = Read-BoundedReleaseText 'docs/releases/1.0.0-rc.1-publication.json' | ConvertFrom-Json
          $pin = @($published.assets | Where-Object name -CEQ 'AzerothNavigator-1.0.0-rc.1-x64-setup.exe')
          if ($pin.Count -ne 1) { throw 'Missing independently retained RC baseline hash' }
          $setup = Get-NativeSmokeSetup dist/windows
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $baselineSetup = Get-NativeSmokeSetup $baseline
          ./scripts/windows/Stable-Acceptance.ps1 -Root . -Directory dist/windows -InstallerSha256 $hash -BaselineInstaller $baselineSetup.FullName -BaselineSha256 $pin[0].sha256 -BuildIdentity release/v1/bundled-content-build-identity.json -OutputDirectory (Join-Path $env:RUNNER_TEMP 'native-smoke/stable-cases')
      - name: Record schema4 hosted observations without inventing missing cases
        if: always() && steps.build_windows.outputs.stable == 'true' && steps.stable_acceptance.outcome != 'skipped'
        shell: pwsh
        run: |
          ./scripts/windows/Write-HostedAcceptanceEvidence.ps1 -Root . -Version '1.0.0' -InstallerDirectory dist/windows -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'native-smoke/stable-cases') -OutputDirectory dist/acceptance-evidence
      - name: Retain schema4 acceptance evidence separately from release assets
        if: always() && steps.build_windows.outputs.stable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-acceptance-evidence-${{ github.sha }}
          path: dist/acceptance-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Retain raw actual stable case reports on success or failure
        if: always() && steps.build_windows.outputs.stable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-case-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-smoke/stable-cases/*.json
            ${{ runner.temp }}/native-smoke/stable-cases/raw/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Hold the package when actual stable acceptance failed
        if: always() && steps.build_windows.outputs.stable == 'true'
        shell: pwsh
        run: |
          if ('${{ steps.stable_acceptance.outcome }}' -ne 'success') { throw 'Actual full-bundle hosted acceptance is missing or failed' }

  draft-release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true # the verifier compares selected asset bytes, never LFS pointer text
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: azeroth-navigator-windows-${{ github.sha }}
          path: dist/release-artifacts
      - name: Download schema4 hosted evidence
        if: github.ref_name == 'v1.0.0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stable-acceptance-evidence-${{ github.sha }}
          path: dist/acceptance-evidence
      - name: Verify checksums
        working-directory: dist/release-artifacts
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Verify release evidence before drafting
        env:
          TAG: ${{ github.ref_name }}
        run: |
          command=release-readiness
          if [ "$TAG" = v1.0.0 ]; then command=release-draft-readiness; fi
          args=()
          if [ -f dist/acceptance-evidence/acceptance-evidence.json ]; then args+=(--evidence dist/acceptance-evidence/acceptance-evidence.json); fi
          cargo run --locked -p azeroth-cli -- "$command" --root . --version "${TAG#v}" "${args[@]}"
      - name: Verify exact release assets and offline materials against source
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $options = @{}
          if ($env:TAG -ceq 'v1.0.0') { $options['ReadinessPhase'] = 'draft'; $options['Evidence'] = 'dist/acceptance-evidence/acceptance-evidence.json' }
          ./scripts/windows/Verify-ReleaseArtifacts.ps1 -Version $env:TAG.Substring(1) -Directory dist/release-artifacts @options
      - name: Create the draft release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          flags=(--draft --verify-tag --title "Azeroth Navigator $version" --notes-file "docs/releases/$version.md")
          case "$version" in 0.*|*-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/release-artifacts/* "${flags[@]}"
