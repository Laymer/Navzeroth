name: Native draft API synthetic engineering probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-api-synthetic:
    name: Native draft API synthetic tests (not release acceptance)
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      EXECUTED_SOURCE: c2052f47dd2cb8a3991e66027ef8193d915e616e
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: c2052f47dd2cb8a3991e66027ef8193d915e616e
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Record exact source and tool identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXECUTED_SOURCE) { throw 'Executed source differs' }
          $out=Join-Path $env:RUNNER_TEMP 'draft-api-native-tests'
          New-Item -ItemType Directory -Path $out | Out-Null
          [ordered]@{schema_version=1;kind='synthetic_engineering_not_acceptance';workflow_sha=$env:GITHUB_SHA;executed_source=$actual;node=(node --version);pwsh=$PSVersionTable.PSVersion.ToString();production_files=@(git ls-tree HEAD scripts/windows/Draft-Installer-Smoke.ps1 scripts/windows/Test-DraftInstallerSmoke.ps1 .github/workflows/verify-release-downloads.yml);acceptance_promoted=$false} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'identity.json') -Encoding utf8
      - name: Native Windows PowerShell 5 synthetic suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $PSVersionTable | Out-String | Write-Host
          Start-Transcript -Path (Join-Path $env:RUNNER_TEMP 'draft-api-native-tests/ps5.log') | Out-Null
          try { & ./scripts/windows/Test-DraftInstallerSmoke.ps1 } finally { Stop-Transcript | Out-Null }
      - name: Native PowerShell 7 synthetic suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSVersionTable | Out-String | Write-Host
          Start-Transcript -Path (Join-Path $env:RUNNER_TEMP 'draft-api-native-tests/ps7.log') | Out-Null
          try { & ./scripts/windows/Test-DraftInstallerSmoke.ps1 } finally { Stop-Transcript | Out-Null }
      - name: Enforce small retained engineering diagnostics
        if: always()
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'draft-api-native-tests'
          if (Test-Path -LiteralPath $dir) {
            $files=@(Get-ChildItem -LiteralPath $dir -File)
            if ($files.Count -gt 3 -or @($files | Where-Object Length -gt 1048576).Count -gt 0) { throw 'Diagnostics exceed bound' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: draft-api-native-synthetic-${{ github.run_id }}
          path: ${{ runner.temp }}/draft-api-native-tests
          if-no-files-found: warn
          retention-days: 7
