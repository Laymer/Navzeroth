name: Independent source knowledge
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'content/source-build-v1.json'
      - 'content/source-materials/**'
      - 'docs/sources/source-admission-v1.json'
      - 'docs/sources/source-updates-v1.json'
      - 'scripts/Build-SourceKnowledge.ps1'
      - '.gitattributes'
      - '.github/workflows/source-knowledge.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'content/source-build-v1.json'
      - 'content/source-materials/**'
      - 'docs/sources/source-admission-v1.json'
      - 'docs/sources/source-updates-v1.json'
      - 'scripts/Build-SourceKnowledge.ps1'
      - '.gitattributes'
      - '.github/workflows/source-knowledge.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: source-knowledge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Offline sources (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve committed source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}
      - name: Provision pinned CLI dependencies
        run: cargo build --locked -p azeroth-cli
      - name: Build twice offline and compare exact outputs
        shell: pwsh
        run: |
          $suffix = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $cli = Join-Path $PWD "target/debug/azeroth-cli$suffix"
          ./scripts/Build-SourceKnowledge.ps1 -Executable $cli -OutputDirectory dist/source-knowledge-a
          ./scripts/Build-SourceKnowledge.ps1 -Executable $cli -OutputDirectory dist/source-knowledge-b
          foreach ($file in @('catalog.json','build.json','closure.json','registry.json','plan.json','NOTICES.txt')) {
            $a = (Get-FileHash "dist/source-knowledge-a/$file" -Algorithm SHA256).Hash
            $b = (Get-FileHash "dist/source-knowledge-b/$file" -Algorithm SHA256).Hash
            if ($a -ne $b) { throw "Non-deterministic source build: $file" }
          }
          # Include the exact original source, licence texts and transformation
          # source revision with the derived artifact, not just its hashes.
          # git archive also runs smudge filters; checkout lfs:false alone is
          # insufficient. Keep committed pointer bytes and never fetch imagery.
          git -c filter.lfs.process= -c filter.lfs.smudge= -c filter.lfs.required=false archive --format=tar --output=dist/source-knowledge-a/navzeroth-source.tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not retain complete transformation source' }
          git rev-parse HEAD | Set-Content dist/source-knowledge-a/source-commit.txt
      - name: Verify source archive retains exact LFS pointer bytes
        shell: bash
        run: |
          set -euo pipefail
          archive_check_dir=$(mktemp -d)
          trap 'rm -rf "$archive_check_dir"' EXIT
          git ls-files -z > "$archive_check_dir/files"
          git check-attr --stdin -z filter < "$archive_check_dir/files" > "$archive_check_dir/attributes"
          awk 'BEGIN{RS="\0"; ORS="\0"} NR%3==1{p=$0} NR%3==0 && $0=="lfs"{print p}' "$archive_check_dir/attributes" > "$archive_check_dir/lfs"
          while IFS= read -r -d '' path; do
            git show "HEAD:$path" > "$archive_check_dir/expected"
            tar -xOf dist/source-knowledge-a/navzeroth-source.tar "$path" > "$archive_check_dir/actual"
            cmp "$archive_check_dir/expected" "$archive_check_dir/actual"
          done < "$archive_check_dir/lfs"
      - name: Check upstream revision metadata without changing retained inputs
        if: runner.os == 'Linux' && github.event_name != 'pull_request' && github.event_name != 'push'
        shell: bash
        run: |
          target/debug/azeroth-cli source-sync --registry docs/sources/source-admission-v1.json --cache content/source-materials/objects --fetch --check-updates docs/sources/source-updates-v1.json > dist/source-knowledge-a/upstream-updates.json
      - run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-knowledge-${{ runner.os }}-${{ github.sha }}
          path: dist/source-knowledge-a/
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Source catalog platform parity
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-knowledge-*-${{ github.sha }}
          path: artifacts
      - name: Compare Linux and Windows source products
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          for file in catalog.json build.json closure.json registry.json plan.json NOTICES.txt; do
            cmp "artifacts/source-knowledge-Linux-$SOURCE_REVISION/$file" "artifacts/source-knowledge-Windows-$SOURCE_REVISION/$file"
          done
