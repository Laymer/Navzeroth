[package]
name = "azeroth-ingest"
description = "Azeroth Navigator bounded import: ANAV1 text transport, SavedVariables literal parser and the fixture importer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
azeroth-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

# Bounded PNG verification for offline pack import; no I/O in core.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
# Pinned test-only property testing; deterministic seeds live in the tests.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
